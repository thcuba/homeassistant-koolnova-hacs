name: Validate HACS Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install homeassistant

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Create validation script
        run: |
          cat > validate.py << 'EOF'
          import json
          import sys
          import os
          from pathlib import Path

          print("=== Validating HACS Integration ===")

          # Find manifest.json
          manifest_files = list(Path("custom_components").glob("*/manifest.json"))
          if not manifest_files:
              print("ERROR: No manifest.json found")
              sys.exit(1)

          manifest_path = manifest_files[0]
          print(f"Found manifest: {manifest_path}")

          # Validate manifest JSON
          try:
              with open(manifest_path) as f:
                  manifest = json.load(f)
              print("✓ manifest.json is valid JSON")
          except Exception as e:
              print(f"ERROR: Invalid manifest.json: {e}")
              sys.exit(1)

          # Check required keys
          required_keys = ['domain', 'name', 'version', 'codeowners']
          for key in required_keys:
              if key in manifest:
                  print(f"✓ {key}: {manifest[key]}")
              else:
                  print(f"ERROR: Missing required key: {key}")
                  sys.exit(1)

          # Check hacs.json
          if os.path.exists("hacs.json"):
              try:
                  with open("hacs.json") as f:
                      hacs = json.load(f)
                  print("✓ hacs.json is valid JSON")
              except Exception as e:
                  print(f"WARNING: Invalid hacs.json: {e}")
          else:
              print("WARNING: hacs.json not found")

          # Check icon.png
          icon_paths = list(Path("custom_components").glob("*/brand/icon.png"))
          if icon_paths:
              print("✓ icon.png found in brand folder")
          elif os.path.exists("icon.png"):
              print("✓ icon.png exists in root")
          else:
              print("WARNING: icon.png not found")

          print("✓ All validations passed")
          EOF
          python3 validate.py

      - name: Clean up
        run: rm -f validate.py
